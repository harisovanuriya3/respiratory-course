<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Oxyhemoglobin dissociation curves</title><desc id="desc">Educational Hill-model saturation curves at P50 values 22, 26.6 and 32 mmHg; right shift lowers saturation at a given PO2.</desc><rect width="800" height="480" fill="#f8fbff"/><g stroke="#d6e2ec" stroke-width="1"><path d="M90 70V400H735M90 235H735M90 152.5H735M90 317.5H735"/></g><g font-family="Arial,sans-serif" fill="#17324d"><text x="400" y="35" font-size="23" text-anchor="middle">Hb–O₂ saturation / P50</text><text x="405" y="455" text-anchor="middle" font-size="17">PO₂ (mmHg)</text><text x="22" y="240" transform="rotate(-90 22 240)" text-anchor="middle" font-size="17">SaO₂ (%)</text><text x="68" y="405">0</text><text x="55" y="240">50</text><text x="48" y="77">100</text><text x="90" y="422">0</text><text x="345" y="422">40</text><text x="610" y="422">80</text><text x="715" y="422">100</text></g><g id="curves" fill="none" stroke-width="4" stroke-linecap="round"></g><g font-family="Arial,sans-serif" font-size="16"><text x="505" y="110" fill="#2563eb">P50 22: left shift</text><text x="505" y="133" fill="#147d65">P50 26.6: reference</text><text x="505" y="156" fill="#c2410c">P50 32: right shift</text><text x="115" y="62" fill="#52667b" font-size="13">Hill approximation, n = 2.7; educational only</text></g><script type="application/ecmascript"><![CDATA[const g=document.getElementById('curves');[[22,'#2563eb'],[26.6,'#147d65'],[32,'#c2410c']].forEach(([p,c])=>{let d='';for(let x=0;x<=100;x++){let sat=Math.pow(x,2.7)/(Math.pow(x,2.7)+Math.pow(p,2.7));d+=(x?'L':'M')+(90+x*6.45).toFixed(2)+' '+(400-330*sat).toFixed(2)+' '}let path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('stroke',c);g.appendChild(path)});]]></script></svg>