<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Altitude and inspired versus alveolar oxygen</title><desc id="d">Worked teaching example. At barometric pressure 760 mmHg, inspired oxygen partial pressure is 149 mmHg and alveolar oxygen is approximately 99 mmHg with PaCO2 40. At barometric pressure 560 mmHg, inspired oxygen partial pressure is 107 mmHg and alveolar oxygen approximately 70 mmHg with PaCO2 30. Both use FiO2 0.209, water vapor 47 mmHg, respiratory quotient 0.8.</desc><rect width="900" height="520" rx="22" fill="#f7fafc"/><text x="450" y="52" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17324d" text-anchor="middle">Altitude: inspired and alveolar PO₂</text><text x="450" y="84" font-family="Arial,sans-serif" font-size="15" fill="#43566a" text-anchor="middle">Worked physiology example · mmHg · FiO₂ 0.209 · PH₂O 47 · R 0.8</text><g font-family="Arial,sans-serif"><text x="280" y="132" font-size="22" text-anchor="middle" font-weight="700" fill="#17324d">Sea level · PB 760</text><text x="655" y="132" font-size="22" text-anchor="middle" font-weight="700" fill="#17324d">Altitude · PB 560</text><rect x="135" y="165" width="125" height="225" rx="10" fill="#087f8c"/><rect x="285" y="240" width="125" height="150" rx="10" fill="#e58d3d"/><rect x="510" y="228" width="125" height="162" rx="10" fill="#087f8c"/><rect x="660" y="284" width="125" height="106" rx="10" fill="#e58d3d"/><g fill="#fff" text-anchor="middle" font-size="23" font-weight="700"><text x="197" y="199">149</text><text x="347" y="273">99</text><text x="572" y="261">107</text><text x="722" y="317">70</text></g><g fill="#17324d" text-anchor="middle" font-size="17"><text x="197" y="419">PIO₂</text><text x="347" y="419">PAO₂</text><text x="572" y="419">PIO₂</text><text x="722" y="419">PAO₂</text></g><text x="280" y="452" font-size="15" fill="#43566a" text-anchor="middle">PaCO₂ = 40 mmHg</text><text x="655" y="452" font-size="15" fill="#43566a" text-anchor="middle">PaCO₂ = 30 mmHg</text><text x="450" y="488" font-size="14" fill="#43566a" text-anchor="middle">PIO₂ = FiO₂(PB − 47); PAO₂ ≈ PIO₂ − PaCO₂/R · teaching approximation</text></g></svg>