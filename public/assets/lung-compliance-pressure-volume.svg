<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">Lung compliance and pressure-volume relationship</title><desc id="desc">Conceptual pressure-volume curves showing that the steeper curve represents greater compliance, while the flatter curve represents lower compliance. Surface tension contributes to elastic recoil and surfactant reduces alveolar surface tension. Not a patient measurement.</desc><rect width="960" height="550" rx="22" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#18394b"><text x="480" y="48" text-anchor="middle" font-size="27" font-weight="700">Lung compliance · pressure–volume relationship</text><text x="480" y="78" text-anchor="middle" font-size="16">Educational curves · conceptual, not patient data</text></g><g stroke="#34566b" stroke-width="3" fill="none"><path d="M140 120V432H820"/></g><g stroke="#d3e0e5" stroke-width="1.5"><path d="M140 350H820M140 270H820M140 190H820M310 120V432M480 120V432M650 120V432"/></g><path d="M145 425 C270 418 335 335 415 230 S570 137 800 130" fill="none" stroke="#078b84" stroke-width="8" stroke-linecap="round"/><path d="M145 425 C310 422 460 389 580 312 S745 245 805 236" fill="none" stroke="#d2773b" stroke-width="8" stroke-linecap="round"/><g font-family="Arial,sans-serif" font-size="18" fill="#18394b"><text x="410" y="180" fill="#06746e" font-weight="700">Higher compliance</text><text x="640" y="341" fill="#ad5b2c" font-weight="700">Lower compliance</text><text x="490" y="476" text-anchor="middle">Transpulmonary pressure →</text><text x="52" y="310" transform="rotate(-90 52 310)" text-anchor="middle">Lung volume →</text><text x="480" y="518" text-anchor="middle" font-size="16">Compliance = ΔV / ΔP · steeper slope means larger volume change per pressure change</text></g></svg>