<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="title description"><title id="title">Alveolar ventilation: respiratory rate and tidal volume</title><desc id="description">Worked educational comparison of two breathing patterns with the same minute ventilation of six litres per minute. Normal pattern: 500 mL times 12 breaths per minute, with dead space 150 mL, yields 4.2 litres per minute alveolar ventilation. Rapid shallow pattern: 250 mL times 24 breaths per minute, with dead space 150 mL, yields 2.4 litres per minute alveolar ventilation.</desc><rect width="920" height="540" rx="24" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#163c4a"><text x="460" y="49" text-anchor="middle" font-size="29" font-weight="700">Alveolar ventilation</text><text x="460" y="82" text-anchor="middle" font-size="17">Same minute ventilation does not mean same alveolar ventilation</text></g><g font-family="Arial,sans-serif"><rect x="42" y="115" width="405" height="340" rx="18" fill="#e6f4f4" stroke="#91b9ba"/><rect x="473" y="115" width="405" height="340" rx="18" fill="#fff0e3" stroke="#d9b59b"/><g text-anchor="middle" fill="#163c4a"><text x="244" y="156" font-size="23" font-weight="700">Resting pattern</text><text x="675" y="156" font-size="23" font-weight="700">Rapid, shallow pattern</text><text x="244" y="197" font-size="19">VT = 500 mL; f = 12/min</text><text x="675" y="197" font-size="19">VT = 250 mL; f = 24/min</text><text x="244" y="233" font-size="17">VD = 150 mL</text><text x="675" y="233" font-size="17">VD = 150 mL</text></g><rect x="110" y="260" width="268" height="38" rx="9" fill="#23818a"/><rect x="541" y="260" width="268" height="38" rx="9" fill="#23818a"/><g fill="#fff" font-size="17" font-weight="700" text-anchor="middle"><text x="244" y="285">VE = 6.0 L/min</text><text x="675" y="285">VE = 6.0 L/min</text></g><rect x="110" y="322" width="268" height="80" rx="12" fill="#246e59"/><rect x="541" y="322" width="268" height="80" rx="12" fill="#b66a37"/><g fill="#fff" text-anchor="middle"><text x="244" y="353" font-size="17">Alveolar ventilation</text><text x="675" y="353" font-size="17">Alveolar ventilation</text><text x="244" y="385" font-size="29" font-weight="700">4.2 L/min</text><text x="675" y="385" font-size="29" font-weight="700">2.4 L/min</text></g></g><g font-family="Arial,sans-serif" fill="#29495b" text-anchor="middle"><text x="460" y="485" font-size="19">VA = (VT − VD) × f</text><text x="460" y="513" font-size="15">Fixed anatomical dead-space example; educational values, not patient measurements.</text></g></svg>