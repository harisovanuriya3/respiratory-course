<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">Ventilation and perfusion: V/Q relationships</title><desc id="d">Educational diagram comparing low V/Q, matched V/Q, and high V/Q units. Low V/Q means relatively reduced alveolar ventilation with preserved perfusion; high V/Q means relatively reduced perfusion with preserved ventilation. Extremes approach shunt and dead space respectively.</desc><rect width="960" height="560" rx="22" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="480" y="45" font-size="27" font-weight="700" text-anchor="middle">Ventilation / perfusion (V̇A/Q̇)</text><text x="480" y="76" font-size="16" text-anchor="middle">Relative gas delivery and pulmonary blood flow</text></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="36" y="112" width="280" height="350" rx="16" fill="#e8f4f7" stroke="#88bac5"/><rect x="340" y="112" width="280" height="350" rx="16" fill="#edf8ee" stroke="#95c59a"/><rect x="644" y="112" width="280" height="350" rx="16" fill="#fff3e6" stroke="#e2ba88"/><g font-size="22" font-weight="700" fill="#17324d"><text x="176" y="150">Low V/Q</text><text x="480" y="150">Matched V/Q</text><text x="784" y="150">High V/Q</text></g><g fill="#fff" stroke="#325e70" stroke-width="4"><circle cx="176" cy="245" r="58"/><circle cx="480" cy="245" r="58"/><circle cx="784" cy="245" r="58"/></g><g fill="none" stroke="#087f8c" stroke-linecap="round"><path d="M176 165V195" stroke-width="5"/><path d="M480 165V195" stroke-width="17"/><path d="M784 165V195" stroke-width="17"/></g><g fill="none" stroke="#cb5a54" stroke-linecap="round"><path d="M105 325H247" stroke-width="17"/><path d="M409 325H551" stroke-width="17"/><path d="M713 325H855" stroke-width="5"/></g><g font-size="17" fill="#17324d"><text x="176" y="368">Ventilation ↓ / Flow ↔</text><text x="480" y="368">Ventilation ↔ / Flow ↔</text><text x="784" y="368">Ventilation ↔ / Flow ↓</text><text x="176" y="407">Shunt-like tendency</text><text x="480" y="407">Efficient matching</text><text x="784" y="407">Dead-space tendency</text></g><g font-size="15" fill="#43566a"><text x="480" y="500">Blue: ventilation · Red: perfusion · Qualitative, not to scale</text><text x="480" y="525">V/Q = 0: shunt limit · V/Q → ∞: dead-space limit</text></g></g></svg>