name: Build downloadable respiratory textbook
on:
  push:
    branches: [main, work/course-completion-audit-20261105, integration/respiratory-latest-20261106]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build complete offline-ready static site
        run: npm run build
      - name: Audit 25-module media previews and trilingual links
        run: node audit-media-preview.mjs
      - name: Verify displayed textbook build version
        run: node test-build-version.mjs
      - name: Validate routes and module links
        run: |
          npm run check
          npm run test:media
          npm run test:navigation
          node test-exam-media-comprehensive.mjs
      - name: Audit all modules and cross-links to specialized media
        run: node test-course-integration-regression.mjs
      - name: Verify added clinical cases and laboratories
        run: |
          node test-detailed-clinical-cases.mjs
          node test-expanded-physiology-cases.mjs
          node test-advanced-reasoning-cases.mjs
          node test-reasoning-self-checks.mjs
          node test-lung-capacity-station.mjs
          node test-acid-base-station.mjs
          node test-altitude-oxygen-station.mjs
          node test-diffusion-station.mjs
          node test-airway-resistance-station.mjs
          node test-compliance-station.mjs
          node test-pulmonary-resistance-station.mjs
          node test-exercise-gas-station.mjs
          node test-sleep-breathing-station.mjs
          node test-breathing-mechanics-lab.mjs
          node test-forced-expiration-extension.mjs
          node test-capacity-spirogram.mjs
          node test-asymmetric-spirogram.mjs
          node test-recorded-spirogram.mjs
          node test-moving-diaphragm.mjs
          node test-patient-case-visuals.mjs
          node test-progress-media.mjs
          node test-media-feature-links.mjs
          node test-capacity-exercise.mjs
          node test-clinical-spirometry-interpretation.mjs
          node test-spirogram-modes.mjs
          node test-spirometry-video-lesson.mjs
          node test-media-rights-review.mjs
          node test-author-lecture-respiratory-case.mjs
          node test-brainstem-lecture-integration.mjs
          node test-lecture-chemoreceptor-cases.mjs
          node test-reflex-pathway-atlas.mjs
          node test-respiratory-reflex-infographics.mjs
          node test-scientifically-reviewed-reflex-figures.mjs
          node test-reflex-figures-in-theory.mjs
          node test-chemoreceptor-comparison.mjs
          node test-regulation-theory-chapters.mjs
          node test-special-breathing-chapters.mjs
          node test-gas-exchange-oxygen-curve.mjs
          node test-altitude-pressure-lab.mjs
          node test-chemoreceptor-practice.mjs
          node test-receptor-response-visual.mjs
          node test-reflex-clinical-tasks.mjs
          node scripts/audit-course-uniqueness.mjs
          node test-interactive-patient-decisions.mjs
          node test-clinical-decision-extension.mjs
          node test-patient-reasoning-set.mjs
          node test-mechanics-patient-cases.mjs
          node test-regulation-patient-cases.mjs
          node test-patient-redesign.mjs
          node test-additional-physiology-checks.mjs
          node test-respiratory-exam-additions.mjs
          node test-spirometry-station.mjs
          node test-vq-learning-model.mjs
          node test-alveolar-gas-station.mjs
          node test-oxygen-delivery-station.mjs
          node test-integrated-learning-extension.mjs
      - name: Inventory repeated media previews without deleting originals
        run: node scripts/audit-media-preview-reuse.mjs
      - name: Verify prepublication module and media integrity
        run: node test-prepublication-integrity.mjs
      - name: Verify thematic scenario questions retain original meaning
        run: node test-scenario-question-preservation.mjs
      - name: Verify 20 unique assessment items per module and language
        run: node test-all-25-assessment-uniqueness.mjs
      - name: Verify cumulative multilingual content checks
        run: |
          node test-advanced-reasoning-cases.mjs
          node test-expanded-physiology-cases.mjs
          node test-module-source-links.mjs
      - name: Check all 425 lesson pages exist
        run: |
          test "$(find dist/modules -mindepth 3 -maxdepth 3 -name index.html | wc -l)" -eq 425
          test -f dist/media-library/index.html
          test -f dist/exam/index.html
      - name: Verify module bibliography anchors
        run: node test-module-source-links.mjs
      - name: Verify consolidated bibliography URLs
        run: node test-consolidated-bibliography.mjs
      - name: Include local Windows launcher
        run: |
          cat > dist/START-LOCAL.bat <<'EOF'
          @echo off
          cd /d "%~dp0"
          echo Open http://localhost:8765 in your browser
          py -m http.server 8765
          pause
          EOF
          cat > dist/README-LOCAL.txt <<'EOF'
          RESPIRATORY PHYSIOLOGY TEXTBOOK - LOCAL PREVIEW
          Extract the ZIP archive into a folder.
          On Windows with Python installed, double-click START-LOCAL.bat.
          Then open http://localhost:8765 in a browser.
          Alternatively run: python -m http.server 8765
          Do not open index.html directly using file:// as route imports need a local web server.
          EOF
      - name: Verify latest patient case integration
        run: |
          node test-interactive-patient-decisions.mjs
          node test-clinical-decision-extension.mjs
      - name: Include review checklist in local textbook
        run: |
          cp docs/FINAL_RELEASE_GATES.md dist/REVIEW-CHECKLIST.md
          printf 'This is a technical review build, not a certified academic edition.\n' > dist/REVIEW-STATUS.txt
      - name: Record immutable build provenance
        run: |
          printf 'Repository: %s\nCommit: %s\nWorkflow run: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/BUILD-CONTROL-POINT.txt
      - name: Upload complete site archive
        uses: actions/upload-artifact@v4
        with:
          name: respiratory-course-local-build
          path: dist/
          retention-days: 14
          if-no-files-found: error
